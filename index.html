    <link rel="stylesheet" href="style.css" />

  <body>
    <main>
    <h1>画像Exifチェッカー（Image Exif Checker）</h1>
    <p>JPEGやPNG画像のメタ情報（Exif）を確認・削除できます。</p>

    <div id="dropZone" class="drop-zone" role="button" tabindex="0">ここに画像をタップまたはドラッグ＆ドロップ</div>
    <p><label for="fileInput">または、下からファイルを選択</label></p>
    <input type="file" id="fileInput" accept="image/jpeg,image/png" />
    <div id="metaInfo" aria-live="polite"></div>
    <fieldset id="cleaningModes">
      <legend>削除方式</legend>
      <label class="method-option">
        <input type="radio" name="cleanMethod" value="lossless" checked />
        <span>無劣化（バイナリ除去）<small>画質を落とさずメタ情報だけを取り除く</small></span>
      </label>
      <label class="method-option">
        <input type="radio" name="cleanMethod" value="reencode" />
        <span>完全再エンコード<small>画像を描き直して保存する。JPEGはわずかに劣化する</small></span>
      </label>
    </fieldset>

    <p class="filename-row"><label for="filenameInput">保存するファイル名（拡張子は自動付与）</label>
      <input type="text"  id="filenameInput" placeholder="ファイル名のみ入力" value="">
      <span id="fileExtensionLabel">.jpg</span>
    </p>
    <button id="cleanButton" type="button" disabled>メタ情報を削除して保存</button>
    <p id="resultInfo" role="status" aria-live="polite"></p>
    <p class="notice">ICCプロファイルも除去するため、広色域の画像では色味が変わることがあります。</p>
    <p class="notice">すべての隠し情報の消去は保証しません。無劣化ではJPEGのSOS以降を保持し、再エンコードでも画素内の隠し情報が残る場合があります。</p>
    <noscript>このツールの利用にはJavaScriptが必要です。</noscript>

    <hr>
    <p class="site-footer">
      🔗 <a href="https://github.com/ipusiron/image-exif-checker" target="_blank" rel="noopener noreferrer">
        GitHubリポジトリーはこちら（ipusiron/image-exif-checker）
      </a>
    </p>
    
    </main>
    <script src="vendor/exifreader/exif-reader.min.js" defer></script>
    <script src="exif-logic.js" defer></script>
    <script src="main.js" defer></script>
  </body>
